{% extends "base.html" %}

{% block content %}
<div class="container">
    <h2>{{ event.title }}</h2>
    <p><strong>Date:</strong> {{ event.date }}</p>
    <p>{{ event.description }}</p>
    <p>
        <strong>Related Blog Post:</strong>
        <a href="{% url 'blog:post_detail' event.blog_post.id %}">
            {{ event.blog_post.title }}
        </a>
    </p>
    <a href="{% url 'blog:events_list' %}" class="btn btn-secondary">Back to Events</a>
</div>
{% endblock %}
