{% extends "base.html" %}

{% block content %}
<div class="container">
    <h2>Upcoming Events</h2>
    {% if events %}
        <ul>
            {% for event in events %}
                <li>
                    <a href="{% url 'blog:event_detail' event.id %}">{{ event.title }}</a>
                    - {{ event.date }}
                    <p>{{ event.description }}</p>
                </li>
            {% endfor %}
        </ul>
    {% else %}
        <p>No upcoming events at the moment.</p>
    {% endif %}
</div>
{% endblock %}
